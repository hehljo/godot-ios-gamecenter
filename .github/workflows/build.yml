name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  desktop-stubs:
    # Empty Linux/Windows libraries so desktop editors and headless test runs
    # load the extension without "No GDExtension library found" errors.
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: windows-2025
            platform: windows
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install SCons
        run: pipx install scons

      - name: Build stub
        run: scons platform=${{ matrix.platform }} target=template_debug arch=${{ matrix.arch }} -j4

      - name: Upload stub
        uses: actions/upload-artifact@v7
        with:
          name: stub-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            example/addons/gamecenter/bin/*.so
            example/addons/gamecenter/bin/*.dll
          if-no-files-found: error

  build:
    needs: desktop-stubs
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          pipx install scons
          brew install ripgrep

      - name: Run native contract tests
        run: tools/run_cpp_tests.sh

      - name: Build Apple binaries
        run: tools/build_xcframework.sh

      - name: Check queued iOS callback lifetime with AddressSanitizer
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime, devices in data["devices"].items() if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')"
          xcrun simctl bootstatus "$simulator_id" -b
          tools/run_ios_callback_test.sh "$simulator_id"

      - name: Download desktop stubs
        uses: actions/download-artifact@v8
        with:
          pattern: stub-*
          merge-multiple: true
          path: example/addons/gamecenter/bin

      - name: Run repository and package tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Package and validate add-on
        run: tools/package_addon.sh

      - name: Download Godot runtimes
        id: godot
        env:
          GODOT_ROOT: ${{ runner.temp }}/gamecenter-godot
        run: |
          godot_45="$(tools/download_godot_macos.sh 4.5.2-stable "$GODOT_ROOT/4.5.2")"
          godot_47="$(tools/download_godot_macos.sh 4.7.2-stable "$GODOT_ROOT/4.7.2")"
          printf 'godot_45=%s\n' "$godot_45" >> "$GITHUB_OUTPUT"
          printf 'godot_47=%s\n' "$godot_47" >> "$GITHUB_OUTPUT"

      - name: Run Godot compatibility smoke tests
        run: |
          tools/run_godot_smoke.sh "${{ steps.godot.outputs.godot_45 }}"
          tools/run_godot_smoke.sh "${{ steps.godot.outputs.godot_47 }}"

      - name: Restore Godot iOS export template
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gamecenter-godot/4.5.2/editor_data/export_templates/4.5.2.stable/ios.zip
          key: godot-ios-template-4.5.2-stable

      - name: Install Godot iOS export template
        env:
          GODOT_ROOT: ${{ runner.temp }}/gamecenter-godot
        run: tools/install_godot_ios_template.sh 4.5.2-stable "$GODOT_ROOT/4.5.2"

      - name: Verify iOS exports and simulator link
        run: tools/run_ios_export_smoke.sh "${{ steps.godot.outputs.godot_45 }}"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: gamecenter-addon
          path: dist/gamecenter-addon.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download release archive
        uses: actions/download-artifact@v8
        with:
          name: gamecenter-addon
          path: dist

      - name: Verify tag matches plug-in version
        run: |
          plugin_version="$(sed -n 's/^version="\([^"]*\)"/\1/p' example/addons/gamecenter/plugin.cfg)"
          test "$GITHUB_REF_NAME" = "v$plugin_version"

      - name: Write checksums
        run: (cd dist && sha256sum gamecenter-addon.zip > SHA256SUMS && cat SHA256SUMS)

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/gamecenter-addon.zip dist/SHA256SUMS \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file marketing/release-notes.md
